name: 每日股票分析

on:
  schedule:
    # 每天北京时间 18:00 运行 (UTC 时间 10:00)
    # 注意：GitHub Actions 使用 UTC 时间，请根据目标市场交易时间调整
    - cron: '0 10 * * 1-5'
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false


jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))  # 随机延迟0-60秒启动
      
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import futu; print('✅ futu SDK import OK')"
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports
      
      - name: 执行股票分析
        run: |
          # 从 GitHub Secrets 读取敏感信息并写入 .env 文件
          cp .env.example .env
          echo "STOCK_LIST=${{ secrets.STOCK_LIST }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}" >> .env
          echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}" >> .env
          echo "TAVILY_API_KEYS=${{ secrets.TAVILY_API_KEYS }}" >> .env
          echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
          echo "SCHEDULE_ENABLED=true" >> .env
          echo "SCHEDULE_TIME=18:00" >> .env

      - name: Run daily analysis
        run: python main.py --schedule

